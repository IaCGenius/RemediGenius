[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "remedigenius-community"
version = "0.1.0rc10"
description = "Evidence-first security investigations with deterministic checks and portable AI workflows"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
mcp = ["mcp>=2.1,<3"]
documents = ["markitdown[pdf,docx,pptx,xlsx]>=0.1.4,<0.2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
rgce = "rgce.cli:main"

[tool.setuptools.packages.find]
include = ["rgce*"]

[tool.setuptools.package-data]
rgce = ["static/*", "capabilities.json", "RULES-PROVENANCE.md", "rules/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
