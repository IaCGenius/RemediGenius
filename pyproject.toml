[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "remedigenius-community"
version = "0.2.0"
description = "Evidence-first security investigations with deterministic checks and portable AI workflows"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
documents = ["markitdown[pdf,docx,pptx,xlsx]>=0.1.4,<0.2"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["rgce*"]

[tool.setuptools.package-data]
rgce = ["RULES-PROVENANCE.md", "rules/*.md", "rules/UPSTREAM-LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
