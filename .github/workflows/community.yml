name: Community release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[aws,documents,test]"
      - run: python -m pytest -q tests
      - run: python -m pytest -q profiles/ce/tests modules/native-source-discovery
      - run: python -m pip wheel --no-deps --wheel-dir dist .
