name: builder
version: 0.1.0
description: "RemediGenius Community builder: vends its own Lambda functions through the lambda kiosk (build, test, deploy, promote, run, reuse). Never reads client data."
hermes_requires: ">=0.21.0"
author: "RemediGenius"
license: "Apache-2.0"
env_requires:
  - name: MODEL_API_KEY
    description: "API key for your OpenAI-compatible model provider (set on the host from Secrets Manager)"
    required: true
