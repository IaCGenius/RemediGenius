model:
  default: __MODEL_NAME__
  provider: custom
  base_url: __MODEL_BASE_URL__
  key_env: MODEL_API_KEY
agent:
  # Includes bounded workflow hops plus skill loading and final delivery.
  max_turns: 24
  # Pinned Hermes 0.21.7 counts total attempts: 2 = initial + one retry.
  api_max_retries: 2
  auto_recovery_cycles: 0
  run_budget_seconds: 480
terminal:
  backend: local
  cwd: /opt/data/work
  timeout: 30
memory:
  memory_enabled: false
  user_profile_enabled: false
skills:
  external_dirs: []
  write_approval: true
curator:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
tools:
  tool_search:
    enabled: "off"
mcp_servers: {}
kanban:
  auto_decompose: false
  auto_promote_children: false
  dispatch_in_gateway: false
  review_dispatch: false
  dispatch_profiles: []
platform_toolsets:
  cli:
    - skills
    - clarify
    - ce_runtime
plugins:
  enabled:
    - ce-runtime
auxiliary:
  ce_review:
    # A short critique; main investigation reasoning remains operator-selected.
    reasoning_effort: none
