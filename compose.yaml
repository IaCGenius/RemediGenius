name: remedigenius-ce

services:
  rgce:
    build:
      context: .
      dockerfile: Dockerfile
    image: remedigenius-ce:0.1.0rc9
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RGCE_PORT:-8765}:8765"
    environment:
      RGCE_HOME: /data
      RGCE_PORT: "8765"
    user: "10001:10001"
    volumes:
      - rgce-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

volumes:
  rgce-data:
