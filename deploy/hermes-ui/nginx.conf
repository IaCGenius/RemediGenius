pid /tmp/nginx.pid;
events {}
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 server {
  listen 8080;
  root /usr/share/nginx/html;
  # Keep the login redirect relative so the published loopback port is preserved.
  absolute_redirect off;
  # Send an unauthenticated page load to the gateway's own login page instead of
  # letting the SPA boot into its "Gateway offline" state. Reuses native Hermes
  # cookie auth; no credentials enter this container.
  location = /__authcheck {
   internal;
   resolver 127.0.0.11 valid=10s;
   set $gateway http://ce-hermes-gateway:9120;
   proxy_pass $gateway/api/auth/me;
   proxy_pass_request_body off;
   proxy_set_header Content-Length "";
   proxy_set_header Host $http_host;
   proxy_set_header Cookie $http_cookie;
  }
  location @login { return 302 /login; }
  location ~ ^/(api|auth|login)(/|$) {
   resolver 127.0.0.11 valid=10s;
   set $backend http://ce-hermes-gateway:9120;
   proxy_pass $backend;
   proxy_http_version 1.1;
   proxy_set_header Host $http_host;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection $connection_upgrade;
   proxy_read_timeout 3600s;
   proxy_buffering off;
  }
  location / {
   auth_request /__authcheck;
   error_page 401 = @login;
   try_files $uri $uri/ /index.html;
  }
 }
}
