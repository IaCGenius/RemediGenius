AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  RemediGenius Community read-only role, template version 1.0.0. Reads AWS configuration and
  security findings; an explicit deny blocks reading your data. Nothing this role allows can
  change your account. See onboarding/aws/README.md.

Metadata:
  TemplateVersion: "1.0.0"   # reviewed deny list from the RemediGenius client role 1.0.0

Parameters:
  ExternalId:
    Type: String
    Description: Generated by your engine's Terraform for this account (output onboarding). Not a secret; do not reuse it.
    MinLength: 32
    MaxLength: 1224
    AllowedPattern: "[A-Za-z0-9_+=,.@:/-]+"
  TrustedRoleArn:
    Type: String
    Description: The engine host role that may assume this role (Terraform output host_role_arn).
    AllowedPattern: "arn:aws[a-z-]*:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+"
  RoleName:
    Type: String
    Default: RemediGeniusCommunityReadOnly
    Description: Keep the default unless you also change readonly_role_name in Terraform.
    AllowedPattern: "[A-Za-z0-9+=,.@_-]+"

Resources:
  ReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: RemediGenius Community read-only (template 1.0.0)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OneEngineRoleWithExternalId
            Effect: Allow
            Principal:
              AWS: !Sub
                - "arn:${AWS::Partition}:iam::${EngineAccount}:root"
                - EngineAccount: !Select [4, !Split [":", !Ref TrustedRoleArn]]
            Action:
              - sts:AssumeRole
              - sts:SetSourceIdentity
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
              ArnEquals:
                aws:PrincipalArn: !Ref TrustedRoleArn
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/SecurityAudit"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/job-function/ViewOnlyAccess"
      Policies:
        - PolicyName: NeverReadClientData
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DenyDataPlaneReads
                Effect: Deny
                Action:
                  # Object names and contents (bucket settings stay readable: s3:GetBucket*)
                  - s3:GetObject*
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:ListMultipartUploadParts
                  - s3-object-lambda:GetObject*
                  - s3vectors:GetVectors
                  - s3vectors:ListVectors
                  - s3vectors:QueryVectors
                  # Table items and records
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PartiQLSelect
                  - dynamodb:GetRecords
                  # Secrets and keys
                  - secretsmanager:GetSecretValue
                  - secretsmanager:BatchGetSecretValue
                  - ssm:GetParameter*
                  - kms:Decrypt
                  # Queries, query text and results
                  - rds-data:ExecuteStatement
                  - rds-data:BatchExecuteStatement
                  - redshift-data:ExecuteStatement
                  - redshift-data:GetStatementResult
                  - redshift:ViewQueriesInConsole
                  - athena:GetQueryResults
                  - athena:GetQueryResultsStream
                  - cleanrooms:GetProtectedQuery
                  - cleanrooms:GetAnalysisTemplate
                  - cleanrooms:GetCollaborationAnalysisTemplate
                  - cleanrooms:BatchGetCollaborationAnalysisTemplate
                  - config:GetStoredQuery
                  # Logs and traces
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                  - logs:GetQueryResults
                  - logs:DescribeQueries
                  - logs:DescribeQueryDefinitions
                  - logs:StartLiveTail
                  - logs:Unmask
                  - rds:DownloadDBLogFilePortion
                  - rds:DownloadCompleteDBLogFile
                  - xray:GetTraceSummaries
                  - xray:BatchGetTraces
                  - xray:GetTraceGraph
                  # Documents, utterances and vocabularies (AI and language services)
                  - bedrock:GetKnowledgeBaseDocuments
                  - bedrock:ListKnowledgeBaseDocuments
                  - qbusiness:ListDocuments
                  - lex:GetUtterancesView
                  - transcribe:GetVocabulary
                  - transcribe:GetMedicalVocabulary
                  - transcribe:GetVocabularyFilter
                  - transcribe:GetTranscriptionJob
                  - transcribe:GetMedicalTranscriptionJob
                  # Your application's end users (workforce identities stay visible)
                  - cognito-idp:ListUsers
                  - cognito-idp:ListUsersInGroup
                  - cognito-idp:ListDevices
                  - cognito-idp:AdminGetUser
                  - cognito-idp:DescribeUserImportJob
                  - cognito-idp:ListUserImportJobs
                  - connect:ListUsers
                  - quicksight:DescribeUser
                  - quicksight:ListUsers
                  - quicksight:DescribeGroupMembership
                  - quicksight:ListGroupMemberships
                  - workmail:DescribeUser
                  - workmail:DescribeEntity
                  - workmail:DescribeGroup
                  - codestar:DescribeUserProfile
                  - codestar:ListUserProfiles
                  - codestar:ListTeamMembers
                  # Messaging, contact centre and marketing audiences
                  - chime:ListChannel*
                  - chime:ListAppInstanceUser*
                  - chime:ListAttendees
                  - chime:ListAttendeeTags
                  - chime:ListRoomMemberships
                  - chime:ListUsers
                  - chime:ListMeetings
                  - chime:ListProxySessions
                  - chime:ListVoiceProfiles
                  - chime:ListMeetingEvents
                  - chime:ListMeetingsReportData
                  - chime:ListAccountUsageReportData
                  - connect:ListRealtimeContactAnalysisSegments*
                  - connect:ListContactReferences
                  - connect:ListContactEvaluations
                  - connect:ListAssociatedContacts
                  - connect:ListDataTableValues
                  - connect:ListDataTablePrimaryValues
                  - ses:ListContacts
                  - ses:ListMembersOfAddressList
                  - ses:ListSuppressedDestinations
                  - sns:ListPhoneNumbersOptedOut
                  - sns:ListSMSSandboxPhoneNumbers
                  - sns:ListSubscriptions
                  - sns:ListSubscriptionsByTopic
                  - sns:GetSubscriptionAttributes
                  - sns:ListEndpointsByPlatformApplication
                  - iot:ListRetainedMessages
                  - iot:GetRetainedMessage
                  # Identity pools, synced user data, face collections
                  - cognito-identity:DescribeIdentity
                  - cognito-identity:ListIdentities
                  - cognito-sync:ListRecords
                  - cognito-sync:ListDatasets
                  - cognito-sync:DescribeDataset
                  - cognito-sync:DescribeIdentityUsage
                  - rekognition:ListUsers
                  - rekognition:ListDatasetEntries
                  # Execution payloads and outputs
                  - bedrock:GetFlowExecution
                  - bedrock:GetExecutionFlowSnapshot
                  - bedrock-agentcore:GetMemory
                  - bedrock-agentcore:ListMemories
                  - bedrock-agentcore:GetPaymentInstrument
                  - bedrock-agentcore:ListPaymentInstruments
                  - bedrock-agentcore:GetPaymentSession
                  - bedrock-agentcore:ListPaymentSessions
                  - ssm:GetAutomationExecution
                  - ssm:DescribeAutomationStepExecutions
                  - ssm:DescribeMaintenanceWindowExecutionTaskInvocations
                  - states:DescribeExecution
                  - states:GetExecutionHistory
                  - transfer:ListFileTransferResults
                  - transfer:DescribeExecution
                  - aiops:GetInvestigation
                  - aiops:ListInvestigationEvents
                  - quicksight:DescribeDashboardSnapshotJobResult
                  - quicksight:ListTopicReviewedAnswers
                  - redshift:DescribeQuery
                  - redshift:DescribeSavedQueries
                  - cloudwatch:GetTelemetryQueryResults
                  - cloudwatch:GetRecords
                  - cloudwatch:GetOmniThread
                  - cleanrooms:ListProtectedQueries
                  - sagemaker:ListRecords
                  - devicefarm:ListArtifacts
                  - devicefarm:ListSamples
                  - devicefarm:ListTestGridSessionArtifacts
                  - codecommit:ListFileCommitHistory
                  # Credentials and secrets returned by read APIs
                  - codepipeline:GetJobDetails
                  - codepipeline:GetThirdPartyJobDetails
                  - cloudwatch:GetSpaceCredentials*
                  - cognito-idp:ListUserPoolClientSecrets
                  - chime:ListVoiceConnectorTerminationCredentials
                  # Faces and human-review payloads
                  - rekognition:ListFaces
                  - rekognition:SearchFaces*
                  - sagemaker:DescribeHumanLoop
                  - sagemaker:DescribeHumanTaskUi
                  - sagemaker:DescribeHubContent
                  - sagemaker:DescribeModelCard
                  # Code and artifacts
                  - cloudfront:GetFunction
                  - cloudfront:GetConnectionFunction
                  - lambda:GetFunction
                  - synthetics:GetCanary
                  - synthetics:DescribeCanaries
                  - lambda:GetLayerVersion
                  - codecommit:GetFile
                  - codecommit:GetBlob
                  - codecommit:GitPull
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  # Instance contents
                  - ec2:GetConsoleOutput
                  - ec2:GetConsoleScreenshot
                  - ec2:GetPasswordData
                  - ebs:GetSnapshotBlock
                  # Media bytes
                  - mediaconnect:DescribeFlowSourceThumbnail
                  - connect:ListWorkspaceMedia
                  # Incident cases (bodies, comments, edits, attachments)
                  - security-ir:GetCase
                  - security-ir:ListComments
                  - security-ir:ListCaseEdits
                  - security-ir:GetCaseAttachmentDownloadUrl
                Resource: "*"
      Tags:
        - Key: rgce:template-version
          Value: "1.0.0"
        - Key: rgce:managed-by
          Value: remedigenius-community

Outputs:
  RoleArn:
    Description: The role the engine assumes (read-only, no data).
    Value: !GetAtt ReadOnlyRole.Arn
  TemplateVersion:
    Value: "1.0.0"
